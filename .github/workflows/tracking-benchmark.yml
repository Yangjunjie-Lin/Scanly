name: Tracking Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
      - develop/sdk-v2
  push:
    branches:
      - main
      - develop
      - develop/sdk-v2

permissions:
  contents: read

jobs:
  tracking-benchmark:
    name: Tracking Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run benchmark:tracking
      - name: Verify exact-head tracking evidence
        run: node -e "const {execFileSync}=require('node:child_process'); const r=require('./benchmark-results/tracking/tracking-results.json'), sdk=require('./package.json').version; const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), tree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(), c=r.semanticContract, b=c?.batchScenarioIdsByMode; if(r.sourceCommit!==head || r.sourceTree!==tree || r.repositoryDirty) throw new Error('Tracking evidence is not from the clean exact head/tree'); if(r.schemaVersion!=='2.3-beta2-development' || r.kind!=='barcode-tracking-and-batch-integration' || r.sdkVersion!==sdk || r.status!=='passed') throw new Error('Tracking report identity failed'); if(c?.version!=='beta2-foundation-34-v1' || c.sha256!=='471f015df54522edafd4a6b80d15e3d8a165ffc14bb974aef41cca978472ee15' || c.executableSemanticsSha256!=='320537c5a3bd759d267ec8be36188e64ace3276a9d4c7ba7104a6bfbfea9d679' || c.requiredScenarioIds?.length!==34 || c.samePayloadScenarioIds?.length!==6 || b?.continuous?.length!==1 || b?.['expected-count']?.length!==2 || b?.checklist?.length!==4 || b?.['unique-physical-instance']?.length!==1 || r.scenarios.map(s=>s.id).join('|')!==c.requiredScenarioIds.join('|')) throw new Error('Frozen tracking semantic contract failed'); if(r.scenarioCount!==34 || !r.pass || r.failureReasons.length!==0 || !r.scenarios.every(s=>s.pass && s.assertions.length>0 && s.assertions.every(a=>a.pass)) || !r.aggregateGates.every(g=>g.pass)) throw new Error(r.failureReasons.join(', ') || 'Tracking benchmark failed'); const m=r.aggregateMetrics; if(m.falseTrackCount!==0 || m.identitySwitchCount!==0 || m.falseBatchCompletionCount!==0 || m.batchScenarioCount!==8 || m.batchScenarioPassCount!==8 || m.samePayloadScenarioCount!==6 || m.samePayloadScenarioPassCount!==6) throw new Error('Tracking aggregate gates failed'); if(r.scaleBaselines.length!==4 || !r.scaleBaselines.every(s=>s.decoderCallsPerFrame===1 && s.maximumAssociationPairs<=s.targetCount*s.targetCount)) throw new Error('Scale baselines are missing or unbounded');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracking-benchmark
          retention-days: 21
          if-no-files-found: error
          path: benchmark-results/tracking/tracking-results.json
