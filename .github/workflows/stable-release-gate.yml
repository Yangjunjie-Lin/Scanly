name: Stable Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [release/sdk-v2-v2.0.0]
    tags: [v2.0.0]

permissions:
  contents: read

jobs:
  stable-release-gate:
    name: Stable Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify required npm publication credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "${NODE_AUTH_TOKEN:-}"
          test "$(npm whoami --registry=https://registry.npmjs.org/)" = "yangjunjielin"
          npm org ls scanly --json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const members = JSON.parse(input);
              if (members.yangjunjielin !== "owner") process.exit(1);
            });
          '
      # Historical RC evidence remains checked by rc:manifest:verify; Stable promotion uses the policy-aware verifier below.
      - name: Verify Stable Manifest and POST_RELEASE_VALIDATION_PENDING policy
        run: npm run stable:manifest:verify -- --require-go
      - name: Verify Stable software quality gates
        run: npm run quality:static
