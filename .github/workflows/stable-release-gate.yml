name: Stable Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [release/sdk-v2-v2.0.0]
    tags: [v2.0.0]

permissions:
  contents: read

jobs:
  stable-release-gate:
    name: Stable Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1
      - run: npm ci
      - name: Verify npm Trusted Publishing prerequisites
        run: |
          set -euo pipefail
          test "$(npm --version)" = "11.5.1"
          test -z "${NODE_AUTH_TOKEN:-}"
          npm ping --registry=https://registry.npmjs.org/ > /dev/null
      # Historical RC evidence remains checked by rc:manifest:verify; Stable promotion uses the policy-aware verifier below.
      - name: Verify Stable Manifest and POST_RELEASE_VALIDATION_PENDING policy
        run: npm run stable:manifest:verify -- --require-go
      - name: Verify Stable software quality gates
        run: npm run quality:static
