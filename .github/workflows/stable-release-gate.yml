name: Stable Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [release/sdk-v2-v2.0.0]
    tags: [v2.0.0]

permissions:
  contents: read

jobs:
  stable-release-gate:
    name: Stable Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # Historical RC evidence remains checked by rc:manifest:verify; Stable promotion uses the policy-aware verifier below.
      - name: Verify Stable Manifest and POST_RELEASE_VALIDATION_PENDING policy
        run: npm run stable:manifest:verify -- --require-go
      - name: Verify Stable software quality gates
        run: npm run quality:static
