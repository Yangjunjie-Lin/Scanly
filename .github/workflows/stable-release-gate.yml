name: Stable Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [release/sdk-v2-v2.0.0]
    tags: [v2.0.0]

permissions:
  contents: read

jobs:
  stable-release-gate:
    name: Stable Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Require Stable-qualified detached Manifest and production gates
        run: npm run rc:manifest:verify -- --mode=stable --require-candidate-tag
      - name: Re-verify fail-closed Physical Evidence
        run: npm run device:evidence:verify
