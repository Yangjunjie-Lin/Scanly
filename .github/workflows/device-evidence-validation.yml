name: Device Evidence Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop/sdk-v2
  push:
    branches:
      - develop/sdk-v2
      - architecture/sdk-v2-beta5-**

permissions:
  contents: read

jobs:
  device-evidence-validation:
    name: Device Evidence Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Verify deterministic physical Ground Truth targets
        run: npm run device:targets:verify
      - name: Verify fail-closed evidence and source identity
        run: npm run device:evidence:verify
      - name: Evaluate Beta 4 integration gate without weakening release evidence
        run: npm run beta4:gate:integration
      - name: Run camera platform contracts
        run: npx vitest run tests/unit/camera-platform.test.ts tests/unit/frame-source.test.ts tests/unit/scanner-lifecycle.test.ts tests/unit/camera-capabilities.test.ts tests/unit/device-evidence-contract.test.ts
      - name: Build per-device report without cross-device averages
        run: npm run benchmark:device
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-evidence-summary
          retention-days: 21
          if-no-files-found: error
          path: benchmark-results/device/device-evidence-summary.json
