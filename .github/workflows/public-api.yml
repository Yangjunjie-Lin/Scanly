name: Public API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop/sdk-v2
  push:
    branches:
      - develop/sdk-v2
      - architecture/sdk-v2-beta2-**

jobs:
  public-api:
    name: Public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run api:snapshot
      - run: npm run api:diff
      - run: npm run packages:smoke
      - run: npm run packages:tarball
