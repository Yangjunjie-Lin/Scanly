name: Industrial Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop/sdk-v2
  push:
    branches:
      - main
      - develop/sdk-v2

permissions:
  contents: read

jobs:
  industrial-benchmark:
    name: Industrial Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build:packages
      - run: npm run fixtures:verify-industrial
      - run: npm run benchmark:industrial -- --full --gate
      - name: Verify exact-head industrial evidence
        run: node -e "const {execFileSync}=require('node:child_process'); const r=require('./benchmark-results/industrial/industrial-results.json'), sdk=require('./package.json').version; const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), tree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(); if(r.sourceCommit!==head || r.sourceTree!==tree || r.repositoryDirty) throw new Error('Industrial evidence is not from the clean exact head/tree'); if(r.schemaVersion!=='beta3-industrial-development-1' || r.kind!=='industrial-recovery-benchmark' || r.sdkVersion!==sdk) throw new Error('Industrial report identity failed'); if(r.counts.positive!==47 || r.counts.negative!==120 || r.corpus.generated!==42 || r.corpus.negative!==120) throw new Error('Industrial corpus counts failed'); if(r.correctness.falsePositiveCount!==0 || r.correctness.formatConfusionCount!==0 || r.correctness.checksumFailureCount!==0 || r.correctness.candidateConflictConfirmedCount!==0) throw new Error('Industrial correctness gate failed'); if(!Object.values(r.gates).every(Boolean)) throw new Error('Industrial deterministic gate failed'); if(r.marginalContribution.additionalTruePositives<1 || r.marginalContribution.additionalFalsePositives!==0) throw new Error('Recovery has no safe positive marginal contribution'); if(r.performance.maximumRouteCount>7 || r.performance.maximumAttempts>12 || r.performance.maximumProcessedPixels<0) throw new Error('Industrial performance budget failed');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industrial-benchmark
          retention-days: 21
          if-no-files-found: error
          path: benchmark-results/industrial/industrial-results.json
