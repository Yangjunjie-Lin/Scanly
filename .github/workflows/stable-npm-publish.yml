name: Stable npm Publication

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact signed Stable SemVer tag to publish (for example v2.0.1)
        required: true
        type: string
      qualify_only:
        description: Verify existing OIDC grants without publishing, modifying packages, or creating tags
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: stable-npm-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  credential-qualification:
    name: Verify existing npm OIDC grants (no publication)
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Exchange existing trusted identities without publishing
        run: node scripts/probe-stable-npm-oidc.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-oidc-qualification
          path: release-dist/npm-oidc-qualification.json
          if-no-files-found: error
          retention-days: 90
  publish:
    name: Publish npm packages with provenance
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.qualify_only) ||
      (github.event.release.prerelease == false && github.event.release.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1
      - run: npm ci
      - name: Resolve and verify signed Stable release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${RELEASE_TAG#v}"
          if [ "$VERSION" = "2.0.0" ]; then
            STABLE_RELEASE_ROOT="release/stable"
          else
            STABLE_RELEASE_ROOT="release/stable/v${VERSION}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "STABLE_RELEASE_ROOT=$STABLE_RELEASE_ROOT" >> "$GITHUB_ENV"
          echo "STABLE_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.tag_name')" = "$RELEASE_TAG"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.draft')" = "false"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.prerelease')" = "false"
          tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type')"
          test "$tag_type" = "tag"
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified')" = "true"
      - name: Verify artifact manifest and create dependency-ordered publication plan
        run: |
          set -euo pipefail
          VERSION="$VERSION" node --input-type=commonjs <<'NODE'
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");
          const path = require("node:path");

          const version = process.env.VERSION;
          const stableRoot = process.env.STABLE_RELEASE_ROOT;
          if (!stableRoot) throw new Error("STABLE_RELEASE_ROOT is missing.");
          const manifest = JSON.parse(fs.readFileSync(path.join(stableRoot, "artifact-manifest.json"), "utf8"));
          if (manifest.version !== version) throw new Error(`Artifact Manifest ${manifest.version} does not match tag version ${version}.`);
          const artifacts = manifest.artifacts.filter((artifact) => artifact.platform === "npm");
          if (!artifacts.length) throw new Error("Artifact Manifest contains no npm packages.");
          const records = artifacts.map((artifact) => {
            if (!artifact.path.startsWith(`${stableRoot}/artifacts/npm/`) || path.isAbsolute(artifact.path)) throw new Error(`Unsafe npm artifact path: ${artifact.path}`);
            const bytes = fs.readFileSync(artifact.path);
            const digest = crypto.createHash("sha256").update(bytes).digest("hex");
            if (digest !== artifact.sha256 || bytes.length !== artifact.size) throw new Error(`Artifact identity mismatch: ${artifact.path}`);
            const packageJson = JSON.parse(execFileSync("tar", ["-xOf", artifact.path, "package/package.json"], { encoding: "utf8" }));
            if (!packageJson.name?.startsWith("@scanly/") || packageJson.version !== version) throw new Error(`Unexpected tarball package identity: ${artifact.path}`);
            if (version !== "2.0.0") {
              if (packageJson.repository?.url !== "git+https://github.com/Yangjunjie-Lin/Scanly.git" || !packageJson.repository?.directory || packageJson.homepage !== "https://github.com/Yangjunjie-Lin/Scanly#readme" || packageJson.bugs?.url !== "https://github.com/Yangjunjie-Lin/Scanly/issues") {
                throw new Error(`${packageJson.name}@${version} tarball is missing canonical repository metadata.`);
              }
            }
            return { name: packageJson.name, artifact: artifact.path, dependencies: Object.keys(packageJson.dependencies ?? {}).filter((name) => name.startsWith("@scanly/")) };
          });
          const packageNames = new Set(records.map((record) => record.name));
          for (const record of records) {
            for (const dependency of record.dependencies) {
              if (!packageNames.has(dependency)) throw new Error(`${record.name} depends on missing manifest artifact ${dependency}.`);
            }
          }
          const remaining = new Map(records.map((record) => [record.name, record]));
          const ordered = [];
          while (remaining.size) {
            const ready = [...remaining.values()].filter((record) => record.dependencies.every((dependency) => !remaining.has(dependency))).sort((a, b) => a.name.localeCompare(b.name));
            if (!ready.length) throw new Error(`Cyclic or missing Scanly package dependencies: ${[...remaining.keys()].join(", ")}`);
            for (const record of ready) {
              ordered.push(record);
              remaining.delete(record.name);
            }
          }
          fs.writeFileSync("stable-npm-publication-plan.tsv", `${ordered.map((record) => `${record.name}\t${record.artifact}`).join("\n")}\n`);
          console.log(`Prepared ${ordered.length} manifest-driven npm publications for ${version}.`);
          NODE
          if [ "$VERSION" = "2.0.0" ]; then
            STABLE_RELEASE_VERSION="$VERSION" npm run stable:manifest:verify -- --require-go
            (cd release/stable && sha256sum --check checksums.sha256)
          else
            STABLE_RELEASE_VERSION="$VERSION" npm run stable:manifest:verify -- --require-go
            (cd "$STABLE_RELEASE_ROOT" && sha256sum --check checksums.sha256)
            npm run package:metadata:verify
          fi
      - name: Verify npm Trusted Publishing prerequisites
        run: |
          set -euo pipefail
          test "$(npm --version)" = "11.5.1"
          test -z "${NODE_AUTH_TOKEN:-}"
          npm ping --registry=https://registry.npmjs.org/ > /dev/null
      - name: Publish manifest-driven npm packages with provenance
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r package tarball; do
            test -n "$package" -a -f "$tarball"
            published="$(npm view "${package}@${VERSION}" version --json 2>/dev/null | tr -d '"' || true)"
            if [ "$published" = "$VERSION" ]; then
              echo "${package}@${VERSION} already exists; verifying and continuing"
            elif [ "$VERSION" = "2.0.0" ]; then
              # Legacy v2.0.0 recovery only: immutable tarballs predate npm's
              # repository-url provenance validation. Add Registry manifest
              # identity while preserving the exact tarball bytes.
              npm_cli="$(readlink -f "$(command -v npm)")"
              npm_internal_modules="$(dirname "$(dirname "$npm_cli")")/node_modules"
              test -d "$npm_internal_modules/pacote" -a -d "$npm_internal_modules/libnpmpublish"
              # Historical v2.0.0 recovery remains token-backed because its
              # immutable tarballs require a low-level Registry manifest
              # override. Future releases use OIDC in the npm publish branch.
              NPM_LEGACY_TOKEN="${{ secrets.NPM_TOKEN }}" NODE_PATH="$npm_internal_modules" node --input-type=commonjs - "$tarball" "$package" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const pacote = require("pacote");
          const { publish } = require("libnpmpublish");

          const tarballPath = path.resolve(process.argv[2]);
          const expectedPackage = process.argv[3];
          const token = process.env.NPM_LEGACY_TOKEN;
          if (!token) throw new Error("NPM_LEGACY_TOKEN is required for v2.0.0 recovery.");

          (async () => {
            const tarballData = fs.readFileSync(tarballPath);
            const manifest = await pacote.manifest(tarballPath, { fullmetadata: true, fullReadJson: true });
            if (manifest.name !== expectedPackage || manifest.version !== "2.0.0") throw new Error(`Unexpected tarball identity ${manifest.name}@${manifest.version}.`);
            manifest.repository = { type: "git", url: "git+https://github.com/Yangjunjie-Lin/Scanly.git" };
            try {
              await publish(manifest, tarballData, {
                access: "public",
                defaultTag: "latest",
                provenance: true,
                registry: "https://registry.npmjs.org/",
                forceAuth: { token },
              });
            } catch (error) {
              if (error?.statusCode === 409 || error?.code === "E409") {
                console.log(`${manifest.name}@${manifest.version} was accepted; waiting for Registry propagation.`);
              } else {
                throw error;
              }
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
            else
              # No Registry token is supplied here. npm exchanges the GitHub
              # Actions OIDC identity with the configured Trusted Publisher.
              npm publish "$tarball" --access public --provenance --tag latest
            fi
          done < stable-npm-publication-plan.tsv

          for attempt in {1..60}; do
            pending=0
            while IFS=$'\t' read -r package tarball; do
              verified="$(npm view "${package}@${VERSION}" version --json 2>/dev/null | tr -d '"' || true)"
              if [ "$verified" != "$VERSION" ]; then
                echo "Waiting for Registry propagation: ${package}@${VERSION} (${attempt}/60)"
                pending=$((pending + 1))
              fi
            done < stable-npm-publication-plan.tsv
            [ "$pending" -eq 0 ] && break
            sleep 10
          done
          test "$pending" -eq 0

          while IFS=$'\t' read -r package tarball; do
            test "$(npm view "$package" dist-tags.latest --json | tr -d '"')" = "$VERSION"
            test "$(npm view "${package}@${VERSION}" dist.attestations.provenance.predicateType --json | tr -d '"')" = "https://slsa.dev/provenance/v1"
          done < stable-npm-publication-plan.tsv
