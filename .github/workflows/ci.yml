name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop/sdk-v2
  push:
    branches:
      - develop/sdk-v2
      - architecture/sdk-v2-beta1-**

jobs:
  verify:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned WASM asset
        run: npm run wasm:verify

      - name: Generate fixtures
        run: npm run fixtures:generate

      - name: Generate scenarios
        run: npm run scenarios:generate

      - name: Generated fixture/scenario drift
        run: git diff --exit-code -- fixtures scenarios

      - name: Static quality contracts
        run: npm run quality:static

      - name: Canonical evidence contracts
        run: npm run quality:evidence

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Documentation links
        run: npm run docs:check

      - name: Unit tests
        run: npm run test:unit

      - name: Multi-Symbology Unit Tests
        run: npm run test:symbologies

      - name: Integration tests
        run: npx vitest run tests/integration

      - name: Coverage
        run: npm run test:coverage

      - name: SDK package builds
        run: npm run build:packages

      - name: Native ESM package import smoke
        run: npm run packages:smoke

      - name: Package tarball and installed-export verification
        run: npm run packages:tarball

      - name: Tracked package output drift
        run: git diff --exit-code -- packages engines

      - name: Production build
        run: npm run build:web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Playwright smoke E2E
        run: npm run test:e2e

      - name: Benchmark smoke (regression gate)
        run: npm run benchmark:smoke

      - name: Curated open-license camera-photo gate
        run: npm run fixtures:verify-external -- --gate --output=benchmark-results/development/external-open-license-validation.json

      - name: Multi-symbology benchmark
        run: npm run benchmark:symbologies -- --gate --gate-mode=integration

      - name: Verify smoke benchmark artifacts
        run: |
          test -f benchmark-results/development/smoke-balanced.json
          test -f benchmark-results/development/smoke-balanced.csv

      - name: Bundle cost report
        run: npm run bundle:analyze

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Upload smoke benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          if-no-files-found: error
          path: |
            benchmark-results/development/smoke-balanced.json
            benchmark-results/development/smoke-balanced.csv
            benchmark-results/development/external-open-license-validation.json
            benchmark-results/ci/bundle-cost.json

  multisymbology-unit:
    name: Multi-Symbology Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run wasm:verify
      - run: npm run test:symbologies

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run wasm:build
      - run: npm run wasm:verify
      - name: Verify reproducible tracked artifact
        run: git diff --exit-code -- engines/zxing-cpp-wasm/wasm

  node-wasm:
    name: Node Multi-Symbology Integration — ${{ matrix.label }}
    needs: wasm-build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
            label: Ubuntu Node 20
          - os: ubuntu-latest
            node: 24
            label: Ubuntu Node 24
          - os: windows-latest
            node: 20
            label: Windows Node 20
          - os: windows-latest
            node: 24
            label: Windows Node 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:symbologies
      - run: npx vitest run tests/integration/zxing-cpp-wasm.test.ts tests/unit/zxing-cpp-wasm-loader.test.ts
      - run: npm run test:wasm:memory -- --iterations=1000

  browser-wasm:
    name: Browser Multi-Symbology Integration — ${{ matrix.browser }}
    needs: wasm-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: Chromium
            project: chromium
          - browser: Firefox
            project: firefox
          - browser: WebKit
            project: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }} --grep "multi-format worker"

  package-tarball:
    name: Package Tarball
    needs: wasm-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build:packages
      - run: npm run packages:smoke
      - run: npm run packages:tarball

  realtime-scanner-unit:
    name: Real-Time Scanner Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx vitest run tests/unit/scanner-session.test.ts tests/unit/frame-scheduler.test.ts tests/unit/frame-quality.test.ts tests/unit/temporal-confirmation.test.ts tests/unit/repeat-policy.test.ts tests/unit/camera-roi.test.ts tests/unit/camera-capabilities.test.ts tests/unit/frame-source.test.ts tests/unit/scanner-lifecycle.test.ts tests/unit/scanner-memory.test.ts tests/unit/scanner-worker.test.ts tests/unit/worker-client.test.ts tests/unit/worker-message-validation.test.ts

  realtime-scanner-integration:
    name: Real-Time Scanner Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run benchmark:realtime -- --allow-missing-worker-wasm
      - name: Verify 20 semantic scenarios and core soak
        run: node -e "const r=require('./benchmark-results/realtime/sequence-results.json'); if(r.schemaVersion!=='2.0-beta1' || r.scenarioCount!==20 || r.scenarios.length!==20) throw new Error('Expected schema 2.0-beta1 with 20 realtime scenarios'); if(!r.scenarios.every(s=>s.pass && s.assertions.length>0 && s.assertions.every(a=>a.pass))) throw new Error('A realtime scenario assertion failed'); if(!r.coreSoak.pass || !r.aggregateGates.integrationPass) throw new Error('Realtime integration/core gates failed');"
      - uses: actions/upload-artifact@v4
        with:
          name: realtime-sequences
          if-no-files-found: error
          path: benchmark-results/realtime/sequence-results.json

  scanner-core-soak:
    name: Scanner Core Soak
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run test:scanner:core-soak
      - name: Verify 10,000 frame core cleanup
        run: node -e "const r=require('./benchmark-results/realtime/core-soak.json'); if(!r.pass) throw new Error(r.failureReasons.join(', ')); if(r.observed.capturedFrames!==10000 || r.observed.pendingFrameCount!==0 || r.observed.activeDecodeCount!==0 || r.observed.finalControlledMemory!==0) throw new Error('Scanner Core Soak bounds failed'); if(r.workerEvidence!=='not-applicable' || r.observed.workerCreatedCount!==0) throw new Error('Core soak must not claim Worker evidence');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-core-soak
          if-no-files-found: error
          path: benchmark-results/realtime/core-soak.json

  scanner-worker-wasm-soak:
    name: Scanner Worker/WASM Soak
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run wasm:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:scanner:worker-wasm-soak -- --iterations=1000
      - name: Verify real Worker/WASM evidence
        run: node -e "const r=require('./benchmark-results/realtime/worker-wasm-soak.json'); const o=r.observed.afterDispose; if(!r.pass) throw new Error(r.failureReasons.join(', ')); if(r.observed.iterations<1000 || o.workerCreatedCount!==1 || o.workerTerminatedCount!==1 || o.workerWasmDecodeCount<1000 || o.peakActiveTaskCount>1 || o.activeTaskCount!==0 || o.wasmInputAllocationBytes!==0 || o.wasmActiveNativeResultCount!==0 || o.pendingFrameCount!==0 || o.activeDecodeCount!==0 || o.staleEvents!==0) throw new Error('Scanner Worker/WASM Soak bounds failed');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-worker-wasm-soak
          if-no-files-found: error
          path: benchmark-results/realtime/worker-wasm-soak.json

  realtime-benchmark:
    name: Real-Time Benchmark
    needs: [realtime-scanner-integration, scanner-core-soak, scanner-worker-wasm-soak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: scanner-worker-wasm-soak
          path: benchmark-results/realtime
      - run: npm run benchmark:realtime -- --require-worker-wasm
      - name: Verify complete realtime report
        run: node -e "const r=require('./benchmark-results/realtime/sequence-results.json'); if(r.schemaVersion!=='2.0-beta1' || r.scenarioCount!==20 || !r.scenarios.every(s=>s.pass && s.assertions.length>0 && s.assertions.every(a=>a.pass))) throw new Error('Realtime scenario evidence failed'); if(!r.coreSoak.pass || r.workerWasmSoak.status!=='passed' || !r.workerWasmSoak.pass || !r.aggregateGates.pass) throw new Error('Complete realtime aggregate gates failed'); const o=r.workerWasmSoak.observed.afterDispose; if(o.workerCreatedCount!==1 || o.workerTerminatedCount!==1 || o.workerWasmDecodeCount<1000 || o.activeTaskCount!==0 || o.wasmInputAllocationBytes!==0 || o.wasmActiveNativeResultCount!==0) throw new Error('Worker/WASM evidence is incomplete');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realtime-complete
          if-no-files-found: error
          path: benchmark-results/realtime/sequence-results.json
