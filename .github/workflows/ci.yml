name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop/sdk-v2
  push:
    branches:
      - develop/sdk-v2
      - architecture/sdk-v2-beta5-**

jobs:
  verify:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned WASM asset
        run: npm run wasm:verify

      - name: Generate fixtures
        run: npm run fixtures:generate

      - name: Generate scenarios
        run: npm run scenarios:generate

      - name: Generated fixture/scenario drift
        run: git diff --exit-code -- fixtures scenarios

      - name: Static quality contracts
        run: npm run quality:static

      - name: Canonical evidence contracts
        run: npm run quality:evidence

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Documentation links
        run: npm run docs:check

      - name: Unit tests
        run: npm run test:unit

      - name: Multi-Symbology Unit Tests
        run: npm run test:symbologies

      - name: Integration tests
        run: npx vitest run tests/integration

      - name: Coverage
        run: npm run test:coverage

      - name: SDK package builds
        run: npm run build:packages

      - name: Native ESM package import smoke
        run: npm run packages:smoke

      - name: Package tarball and installed-export verification
        run: npm run packages:tarball

      - name: Tracked package output drift
        run: |
          status="$(git status --porcelain --untracked-files=all -- packages engines)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Production build
        run: npm run build:web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Playwright smoke E2E
        run: npm run test:e2e

      - name: Benchmark smoke (regression gate)
        run: npm run benchmark:smoke

      - name: Curated open-license camera-photo gate
        run: npm run fixtures:verify-external -- --gate --output=benchmark-results/development/external-open-license-validation.json

      - name: Multi-symbology benchmark
        run: npm run benchmark:symbologies -- --gate --gate-mode=integration

      - name: Verify smoke benchmark artifacts
        run: |
          test -f benchmark-results/development/smoke-balanced.json
          test -f benchmark-results/development/smoke-balanced.csv

      - name: Bundle cost report
        run: npm run bundle:analyze

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Upload smoke benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          if-no-files-found: error
          path: |
            benchmark-results/development/smoke-balanced.json
            benchmark-results/development/smoke-balanced.csv
            benchmark-results/development/external-open-license-validation.json
            benchmark-results/ci/bundle-cost.json

  multisymbology-unit:
    name: Multi-Symbology Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run wasm:verify
      - run: npm run test:symbologies

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run wasm:build
      - run: npm run wasm:verify
      - name: Verify reproducible tracked artifact
        run: git diff --exit-code -- engines/zxing-cpp-wasm/wasm

  node-wasm:
    name: Node Multi-Symbology Integration — ${{ matrix.label }}
    needs: wasm-build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
            label: Ubuntu Node 20
          - os: ubuntu-latest
            node: 24
            label: Ubuntu Node 24
          - os: windows-latest
            node: 20
            label: Windows Node 20
          - os: windows-latest
            node: 24
            label: Windows Node 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:symbologies
      - run: npx vitest run tests/integration/zxing-cpp-wasm.test.ts tests/unit/zxing-cpp-wasm-loader.test.ts
      - run: npm run test:wasm:memory -- --iterations=1000

  browser-wasm:
    name: Browser Multi-Symbology Integration — ${{ matrix.browser }}
    needs: wasm-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: Chromium
            project: chromium
          - browser: Firefox
            project: firefox
          - browser: WebKit
            project: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }} --grep "multi-format worker"

  package-tarball:
    name: Package Tarball
    needs: wasm-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build:packages
      - run: npm run packages:smoke
      - run: npm run packages:tarball

  realtime-scanner-unit:
    name: Real-Time Scanner Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx vitest run tests/unit/scanner-session.test.ts tests/unit/frame-scheduler.test.ts tests/unit/frame-quality.test.ts tests/unit/temporal-confirmation.test.ts tests/unit/repeat-policy.test.ts tests/unit/camera-roi.test.ts tests/unit/camera-capabilities.test.ts tests/unit/frame-source.test.ts tests/unit/scanner-lifecycle.test.ts tests/unit/scanner-memory.test.ts tests/unit/scanner-worker.test.ts tests/unit/worker-client.test.ts tests/unit/worker-message-validation.test.ts

  realtime-scanner-integration:
    name: Real-Time Scanner Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run benchmark:realtime -- --allow-missing-worker-wasm
      - name: Verify 20 semantic scenarios and core soak
        run: node -e "const {execFileSync}=require('node:child_process'); const r=require('./benchmark-results/realtime/sequence-results.json'); const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); if(r.sourceCommit!==head || r.repositoryDirty) throw new Error('Realtime integration evidence is not from the clean exact head'); if(r.schemaVersion!=='2.0-beta1' || r.scenarioCount!==20 || r.scenarios.length!==20) throw new Error('Expected schema 2.0-beta1 with 20 realtime scenarios'); if(!r.scenarios.every(s=>s.pass && s.assertions.length>0 && s.assertions.every(a=>a.pass))) throw new Error('A realtime scenario assertion failed'); if(!r.coreSoak.pass || !r.aggregateGates.integrationPass) throw new Error('Realtime integration/core gates failed');"
      - uses: actions/upload-artifact@v4
        with:
          name: realtime-sequences
          if-no-files-found: error
          path: benchmark-results/realtime/sequence-results.json

  scanner-core-soak:
    name: Scanner Core Soak
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run test:scanner:core-soak
      - name: Verify 10,000 frame core cleanup
        run: node -e "const {execFileSync}=require('node:child_process'); const r=require('./benchmark-results/realtime/core-soak.json'); const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); if(r.sourceCommit!==head || r.repositoryDirty) throw new Error('Scanner Core Soak is not from the clean exact head'); if(!r.pass) throw new Error(r.failureReasons.join(', ')); if(r.observed.capturedFrames!==10000 || r.observed.pendingFrameCount!==0 || r.observed.activeDecodeCount!==0 || r.observed.finalControlledMemory!==0) throw new Error('Scanner Core Soak bounds failed'); if(r.workerEvidence!=='not-applicable' || r.observed.workerCreatedCount!==0) throw new Error('Core soak must not claim Worker evidence');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-core-soak
          if-no-files-found: error
          path: benchmark-results/realtime/core-soak.json

  scanner-worker-wasm-soak:
    name: Scanner Worker/WASM Soak
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run wasm:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:scanner:worker-wasm-soak -- --iterations=1000
      - name: Verify real Worker/WASM evidence
        run: node -e "const {execFileSync}=require('node:child_process'); const r=require('./benchmark-results/realtime/worker-wasm-soak.json'); const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); const o=r.observed.afterDispose; if(r.sourceCommit!==head || r.repositoryDirty) throw new Error('Scanner Worker/WASM Soak is not from the clean exact head'); if(!r.pass) throw new Error(r.failureReasons.join(', ')); if(r.observed.iterations<1000 || o.workerCreatedCount!==1 || o.workerTerminatedCount!==1 || o.workerWasmDecodeCount<1000 || o.peakActiveTaskCount>1 || o.activeTaskCount!==0 || o.wasmInputAllocationBytes!==0 || o.wasmActiveNativeResultCount!==0 || o.pendingFrameCount!==0 || o.activeDecodeCount!==0 || o.staleEvents!==0) throw new Error('Scanner Worker/WASM Soak bounds failed');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-worker-wasm-soak
          if-no-files-found: error
          path: benchmark-results/realtime/worker-wasm-soak.json

  realtime-benchmark:
    name: Real-Time Benchmark
    needs: [realtime-scanner-integration, scanner-core-soak, scanner-worker-wasm-soak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: scanner-worker-wasm-soak
          path: benchmark-results/realtime
      - run: npm run benchmark:realtime -- --require-worker-wasm
      - name: Verify complete realtime report
        run: node -e "const {execFileSync}=require('node:child_process'); const r=require('./benchmark-results/realtime/sequence-results.json'); const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); if(r.sourceCommit!==head || r.repositoryDirty || r.workerWasmSoak.sourceCommit!==head || r.workerWasmSoak.repositoryDirty) throw new Error('Complete realtime evidence is not from the clean exact head'); if(r.schemaVersion!=='2.0-beta1' || r.scenarioCount!==20 || !r.scenarios.every(s=>s.pass && s.assertions.length>0 && s.assertions.every(a=>a.pass))) throw new Error('Realtime scenario evidence failed'); if(!r.coreSoak.pass || r.workerWasmSoak.status!=='passed' || !r.workerWasmSoak.pass || !r.aggregateGates.pass) throw new Error('Complete realtime aggregate gates failed'); const o=r.workerWasmSoak.observed.afterDispose; if(o.workerCreatedCount!==1 || o.workerTerminatedCount!==1 || o.workerWasmDecodeCount<1000 || o.activeTaskCount!==0 || o.wasmInputAllocationBytes!==0 || o.wasmActiveNativeResultCount!==0) throw new Error('Worker/WASM evidence is incomplete');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realtime-complete
          if-no-files-found: error
          path: benchmark-results/realtime/sequence-results.json

  barcode-tracking-unit:
    name: Barcode Tracking Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx vitest run tests/unit/barcode-tracker.test.ts tests/unit/track-association.test.ts tests/unit/track-lifecycle.test.ts tests/unit/track-occlusion.test.ts tests/unit/track-crossing.test.ts tests/unit/track-same-payload.test.ts

  barcode-tracking-integration:
    name: Barcode Tracking Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run benchmark:tracking
      - name: Verify deterministic ground-truth tracking suite
        run: node -e "const {execFileSync}=require('node:child_process'); const r=require('./benchmark-results/tracking/tracking-results.json'); const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), tree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(), c=r.semanticContract, b=c?.batchScenarioIdsByMode; if(r.sourceCommit!==head || r.sourceTree!==tree || r.repositoryDirty) throw new Error('Tracking integration evidence is not from the clean exact head/tree'); if(r.schemaVersion!=='2.3-beta2-development' || r.kind!=='barcode-tracking-and-batch-integration' || r.sdkVersion!=='2.0.0-rc.2' || r.status!=='passed' || r.scenarioCount!==34 || r.scenarios.length!==34) throw new Error('Tracking scenario identity/count failed'); if(c?.version!=='beta2-foundation-34-v1' || c.sha256!=='471f015df54522edafd4a6b80d15e3d8a165ffc14bb974aef41cca978472ee15' || c.executableSemanticsSha256!=='320537c5a3bd759d267ec8be36188e64ace3276a9d4c7ba7104a6bfbfea9d679' || c.requiredScenarioIds?.length!==34 || c.samePayloadScenarioIds?.length!==6 || b?.continuous?.length!==1 || b?.['expected-count']?.length!==2 || b?.checklist?.length!==4 || b?.['unique-physical-instance']?.length!==1 || r.scenarios.map(s=>s.id).join('|')!==c.requiredScenarioIds.join('|')) throw new Error('Frozen tracking semantic contract failed'); if(!r.pass || r.failureReasons.length!==0 || !r.scenarios.every(s=>s.pass && s.assertions.length>0 && s.assertions.every(a=>a.pass)) || !r.aggregateGates.every(g=>g.pass)) throw new Error(r.failureReasons.join(', ') || 'Tracking assertions failed'); const m=r.aggregateMetrics; if(m.falseTrackCount!==0 || m.identitySwitchCount!==0 || m.samePayloadScenarioCount!==6 || m.samePayloadScenarioPassCount!==6) throw new Error('Tracking identity gates failed');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barcode-tracking-integration
          if-no-files-found: error
          path: benchmark-results/tracking/tracking-results.json

  batch-scan-integration:
    name: Batch Scan Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx vitest run tests/unit/batch-session.test.ts tests/unit/batch-expected-count.test.ts tests/unit/batch-checklist.test.ts tests/unit/batch-duplicate-quantity.test.ts
      - run: npm run benchmark:tracking
      - name: Verify batch ground-truth gates
        run: node -e "const {execFileSync}=require('node:child_process'); const r=require('./benchmark-results/tracking/tracking-results.json'), head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), tree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(), c=r.semanticContract, b=c?.batchScenarioIdsByMode, m=r.aggregateMetrics; if(r.sourceCommit!==head || r.sourceTree!==tree || r.repositoryDirty || !r.pass || r.status!=='passed') throw new Error('Batch evidence identity failed'); if(c?.sha256!=='471f015df54522edafd4a6b80d15e3d8a165ffc14bb974aef41cca978472ee15' || c.executableSemanticsSha256!=='320537c5a3bd759d267ec8be36188e64ace3276a9d4c7ba7104a6bfbfea9d679' || b?.continuous?.length!==1 || b?.['expected-count']?.length!==2 || b?.checklist?.length!==4 || b?.['unique-physical-instance']?.length!==1 || m.batchScenarioCount!==8 || m.batchScenarioPassCount!==8 || m.falseBatchCompletionCount!==0) throw new Error('Batch integration gates failed');"

  tracking-soak:
    name: Tracking Soak
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run test:tracking:soak
      - name: Verify 10,000 frame tracking cleanup
        run: node -e "const {execFileSync}=require('node:child_process'); const r=require('./benchmark-results/tracking/tracking-soak.json'); const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), tree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(), o=r.observed; if(r.sourceCommit!==head || r.sourceTree!==tree || r.repositoryDirty) throw new Error('Tracking Core Soak is not from the clean exact head/tree'); if(r.schemaVersion!=='2.3-beta2-development' || r.kind!=='tracking-core-soak' || r.sdkVersion!=='2.0.0-rc.2' || r.status!=='passed' || !r.pass || r.failureReasons.length!==0 || !Array.isArray(r.assertions) || r.assertions.length===0 || !r.assertions.every(a=>a.pass) || r.iterations!==10000 || r.targetCount!==16) throw new Error(r.failureReasons.join(', ') || 'Tracking soak failed'); if(o.decoderCalls!==10000 || o.decoderCallsPerFrame!==1 || o.peakTrackMapSize>24 || o.peakAssociationPairs>576 || o.peakEventHistorySize>o.eventHistoryCapacity || o.finalEventHistorySize!==0 || o.finalActiveTrackCount!==0 || o.finalLostTrackCount!==0 || o.finalPendingObservationCount!==0 || o.finalROIState!==0 || o.finalBatchRetainedTrackCount!==0 || o.finalBatchRetainedPhysicalInstanceCount!==0 || o.finalControlledMemory!==0) throw new Error('Tracking soak bounds failed'); if(r.workerEvidence!=='not-applicable') throw new Error('Core tracking soak must not claim Worker evidence');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracking-soak
          if-no-files-found: error
          path: benchmark-results/tracking/tracking-soak.json

  tracking-worker-wasm-soak:
    name: Tracking Worker/WASM Soak
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run wasm:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:tracking:worker-wasm-soak
      - name: Verify 1,000-frame multi-code Worker/WASM tracking evidence
        run: node -e "const {execFileSync}=require('node:child_process'); const r=require('./benchmark-results/tracking/worker-wasm-soak.json'); const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), tree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(), o=r.observed, s=o.scannerAfterDispose, t=o.trackerAfterDispose; if(r.sourceCommit!==head || r.sourceTree!==tree || r.repositoryDirty) throw new Error('Tracking Worker/WASM Soak is not from the clean exact head/tree'); if(r.schemaVersion!=='2.3-beta2-development' || r.kind!=='tracking-worker-wasm-soak' || r.sdkVersion!=='2.0.0-rc.2' || r.status!=='passed' || !r.pass || r.failureReasons.length!==0 || !Array.isArray(r.assertions) || r.assertions.length===0 || !r.assertions.every(a=>a.pass) || r.tier!=='pull-request' || o.iterations<1000) throw new Error(r.failureReasons.join(', ') || 'Tracking Worker/WASM soak failed'); if(r.workerEvidence!=='actual-browser-worker' || r.wasmEvidence!=='actual-zxing-cpp-wasm' || r.multiCodeEvidence!=='scanner-observation-set-to-barcode-tracker') throw new Error('Worker/WASM evidence provenance failed'); if(o.trackingModeObservationSetCount!==o.iterations || o.fullFrameTrackingObservationSetCount!==o.iterations || o.completeObservationSetCount!==o.iterations || o.multiResultObservationSetCount!==o.iterations || s.workerCreatedCount!==1 || s.workerTerminatedCount!==1 || s.workerWasmDecodeCount<1000 || s.peakActiveTaskCount>1 || s.activeTaskCount!==0 || s.wasmInputAllocationBytes!==0 || s.wasmActiveNativeResultCount!==0 || t.activeTrackCount!==0 || t.lostTrackCount!==0 || t.pendingObservationCount!==0 || o.finalControlledMemory!==0) throw new Error('Tracking Worker/WASM bounds failed');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracking-worker-wasm-soak
          if-no-files-found: error
          path: benchmark-results/tracking/worker-wasm-soak.json

  industrial-recovery-unit:
    name: Industrial Recovery Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx vitest run tests/unit/difficulty-diagnosis.test.ts tests/unit/recovery-planner.test.ts tests/unit/low-contrast-recovery.test.ts tests/unit/illumination-recovery.test.ts tests/unit/blur-recovery.test.ts tests/unit/glare-recovery.test.ts tests/unit/perspective-recovery.test.ts tests/unit/curved-recovery.test.ts tests/unit/small-module-recovery.test.ts tests/unit/damaged-recovery.test.ts tests/unit/quiet-zone-recovery.test.ts tests/unit/dpm-experimental.test.ts tests/unit/candidate-region.test.ts tests/unit/decode-candidate-conflict.test.ts tests/unit/scan-evidence.test.ts tests/unit/scanner-diagnostics.test.ts tests/unit/recovery-pipeline.test.ts tests/unit/industrial-memory.test.ts

  industrial-recovery-integration:
    name: Industrial Recovery Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build:packages
      - run: npm run fixtures:verify-industrial
      - run: npx vitest run tests/unit/industrial-runtime-integration.test.ts tests/unit/industrial-worker.test.ts tests/unit/industrial-corpus.test.ts tests/unit/industrial-benchmark.test.ts
      - run: npm run benchmark:industrial -- --gate

  industrial-negative-gate:
    name: Industrial Negative Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build:packages
      - run: npm run benchmark:industrial:negative -- --full --gate
      - name: Verify 120-case zero-FP exact-head evidence
        run: node -e "const {execFileSync}=require('node:child_process'); const r=require('./benchmark-results/industrial/negative-results.json'); const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), tree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(); if(r.sourceCommit!==head || r.sourceTree!==tree || r.repositoryDirty) throw new Error('Industrial negative evidence is not from the clean exact head/tree'); if(r.schemaVersion!=='beta3-industrial-development-1' || r.kind!=='industrial-negative-gate' || r.counts.negative!==120) throw new Error('Industrial negative corpus identity failed'); if(r.correctness.falsePositiveCount!==0 || r.correctness.formatConfusionCount!==0 || r.correctness.checksumFailureCount!==0 || !r.gates.falsePositivesZero) throw new Error('Industrial negative gate failed');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industrial-negative-gate
          if-no-files-found: error
          path: benchmark-results/industrial/negative-results.json

  industrial-soak:
    name: Industrial Soak
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build:packages
      - run: npm run test:industrial:soak
      - name: Verify 5,000-frame recovery cleanup
        run: node -e "const {execFileSync}=require('node:child_process'); const r=require('./benchmark-results/industrial/industrial-soak.json'); const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), tree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(), o=r.observed; if(r.sourceCommit!==head || r.sourceTree!==tree || r.repositoryDirty) throw new Error('Industrial soak is not from the clean exact head/tree'); if(r.schemaVersion!=='beta3-industrial-soak-1' || r.kind!=='industrial-recovery-core-soak' || !r.pass || o.iterations!==5000) throw new Error('Industrial soak identity failed'); if(o.finalTemporaryBuffers!==0 || o.finalRouteState!==0 || o.finalNativeResultCount!==0 || o.finalPendingScannerFrames!==0 || o.finalControlledMemory!==0) throw new Error('Industrial soak cleanup failed'); if(r.workerEvidence!=='not-applicable-core-soak') throw new Error('Core soak must not claim Worker evidence');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industrial-soak
          if-no-files-found: error
          path: benchmark-results/industrial/industrial-soak.json
